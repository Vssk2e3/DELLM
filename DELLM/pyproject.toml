[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dellm"
version = "0.1.0"
description = "DELLM: Edge-Assisted DDoS Detection using a Low-Rank-Adapted Language Model in IIoT"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
